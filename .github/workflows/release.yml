name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `npm stage publish` (scripts/stage-publish.mjs) needs a recent npm.
      - run: npm install -g npm@11.19.1
      # The version script also bumps the plugin manifest and its marketplace entry, so the plugin
      # and @rosdal/dazzle always release with the same version.
      # Publishing stays off until the repo variable NPM_PUBLISH is "true". It authenticates with
      # npm trusted publishing (OIDC, via id-token: write), so there is no npm token, and npm adds
      # provenance. The trusted publisher may only stage a release, so `pnpm release` stages it with
      # scripts/stage-publish.mjs; approve it on npmjs.com.
      - name: Open release PR or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: ${{ vars.NPM_PUBLISH == 'true' && 'pnpm release' || '' }}
          pr-title: "chore: release"
          commit-message: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
