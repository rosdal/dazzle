name: Skill triggers

# Runs the dazzle skill's trigger tests against the Claude API. Nightly and by hand only: it costs
# tokens, so it never runs on pull requests. Needs the ANTHROPIC_API_KEY repository secret; without
# it the job is skipped.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triggers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        if: env.ANTHROPIC_API_KEY != ''
      - uses: pnpm/action-setup@v6
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/setup-node@v7
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version: 24
          cache: pnpm
      - if: env.ANTHROPIC_API_KEY != ''
        run: pnpm install --frozen-lockfile
      - name: Install Claude Code
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code
      - name: Run trigger tests
        if: env.ANTHROPIC_API_KEY != ''
        run: pnpm test:triggers
      - name: Skipped
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "ANTHROPIC_API_KEY is not set; trigger tests skipped."
